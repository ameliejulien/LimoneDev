services:
   postgresdb:
      container_name: postgresdb
      image: postgres:16.0
      volumes:
         - ./data/postgres:/var/lib/postgresql/data
      ports:
         # - 127.0.0.1:${PGDB_PORT}:5432
         - 127.0.0.1:${PGDB_PORT}:5432
      environment:
         POSTGRES_PASSWORD: ${DB_PASSWORD}
         POSTGRES_USER: ${DB_USER}
         POSTGRES_DB: ${DB_NAME}
         PGDATA: /var/lib/postgresql/data/pgdata
      networks:
         - sae

   web:
      container_name: web
      image: php:8.2-apache
      ports:
        - ${PORT_WEB}:80
      volumes:
         - ./data/web/html:/var/www/html
         - ./data/web/logs:/var/www/logs
      #environment:
      #   VIRTUAL_HOST: ${EQUIPE}.ventsdouest.dev
      #   LETSENCRYPT_HOST: ${EQUIPE}.ventsdouest.dev
      #   LETSENCRYPT_EMAIL: gildas@bigpapoo.com
      networks:
         - sae
      #   - webproxy_back
      depends_on:
         - postgresdb

   pgadmin:
      image: dpage/pgadmin4
      restart: always
      ports:
         - ${PORT_PGADMIN}:80
      environment:
      #   VIRTUAL_HOST: dbadmin-${EQUIPE}.ventsdouest.dev
      #   LETSENCRYPT_HOST: dbadmin-${EQUIPE}.ventsdouest.dev
      #   LETSENCRYPT_EMAIL: gildas@bigpapoo.com
         PGADMIN_DEFAULT_EMAIL: ${EQUIPE}@dbadmin-sae.com
         PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
         PGADMIN_DISABLE_POSTFIX: true
      networks:
         - sae
      #   - webproxy_back
      depends_on:
         - postgresdb

networks:
   sae:
   #webproxy_back:
   #   external: true